name: Embedding Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: embedding-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-embeddings:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run local embedding integration tests
        env:
          GALLERY_RUN_EMBEDDING_INTEGRATION: "1"
        run: pytest --tb=short -m integration
