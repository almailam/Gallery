name: Models Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: models-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-models:
    runs-on: ubuntu-latest
    env:
      MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run GitHub Models integration tests
        run: pytest --tb=short -m integration
