name: Copilot Auto Review

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest

    steps:
      - name: Request Copilot review
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commitShas = (context.payload.commits || []).map((c) => c.id);
            if (commitShas.length === 0 && context.sha) {
              commitShas.push(context.sha);
            }

            const copilotLogins = [
              "copilot-pull-request-reviewer[bot]",
              "github-copilot[bot]",
              "github-copilot-for-pull-requests[bot]",
            ];

            const pullNumbers = new Set();
            for (const sha of commitShas) {
              try {
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: sha,
                });
                for (const pr of prs || []) {
                  if (pr && pr.number) {
                    pullNumbers.add(pr.number);
                  }
                }
              } catch (error) {
                core.info(
                  `Could not resolve PRs for commit '${sha}': ${error.status || "unknown"} ${error.message}`,
                );
              }
            }

            if (pullNumbers.size === 0) {
              core.info("No PRs associated with pushed commits on main.");
              return;
            }

            for (const pull_number of pullNumbers) {
              const pr = await github.rest.pulls.get({ owner, repo, pull_number });

              if (pr.data.state !== "open") {
                core.info(`Skipping PR #${pull_number} because it is not open.`);
                continue;
              }

              if (pr.data.draft) {
                core.info(`Skipping PR #${pull_number} because it is draft.`);
                continue;
              }

              const requested = (pr.data.requested_reviewers || [])
                .map((reviewer) => reviewer.login);

              if (requested.some((login) => copilotLogins.includes(login))) {
                core.info(`Copilot is already requested on PR #${pull_number}.`);
                continue;
              }

              for (const reviewer of copilotLogins) {
                try {
                  await github.rest.pulls.requestReviewers({
                    owner,
                    repo,
                    pull_number,
                    reviewers: [reviewer],
                  });
                  core.info(`Requested Copilot review on PR #${pull_number} using '${reviewer}'.`);
                  break;
                } catch (error) {
                  core.info(
                    `Could not request reviewer '${reviewer}' on PR #${pull_number}: ${error.status || "unknown"} ${error.message}`,
                  );
                }
              }
            }
